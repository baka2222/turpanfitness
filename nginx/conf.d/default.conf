# ─────────────────────────────────────────────────────────────────────────────
# Turpan Fitness — single reverse-proxy entrypoint.
# Put Cloudflare (orange-cloud proxy or a cloudflared Tunnel) in front of :80.
# Cloudflare terminates TLS and forwards X-Forwarded-Proto: https, which we
# honour below so the apps generate correct https URLs / pass CSRF checks.
# ─────────────────────────────────────────────────────────────────────────────

# Preserve the *original* scheme seen by Cloudflare; fall back to our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

# Docker's embedded DNS — lets us re-resolve service names at request time so a
# restarted container (new IP) doesn't leave nginx pinned to a stale address.
resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 80 default_server;
    server_name _;

    # CKEditor uploads / video tours can be large.
    client_max_body_size 500m;

    # Common proxy headers, reused across upstreams.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;

    # ── Uploaded media (written by Django admin, shared volume) ──────────────
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── Django collected static (admin / jazzmin / ckeditor assets) ──────────
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── FastAPI public API + its docs ────────────────────────────────────────
    location /api/ {
        set $backend backend;
        proxy_pass http://$backend:8000$request_uri;
    }
    location ~ ^/(docs|redoc|openapi\.json)$ {
        set $backend backend;
        proxy_pass http://$backend:8000$request_uri;
    }

    # ── Django admin panel + CKEditor upload endpoint ────────────────────────
    location /admin/ {
        set $admin admin;
        proxy_pass http://$admin:8000$request_uri;
    }
    location /ckeditor5/ {
        set $admin admin;
        proxy_pass http://$admin:8000$request_uri;
    }

    # ── Next.js frontend (everything else, incl. /_next/*) ───────────────────
    location / {
        set $frontend frontend;
        proxy_pass http://$frontend:3000$request_uri;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
